app-id: fyi.soltfrfr.NightmareEditor
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: NightmareEditor
modules:
  - name: NightmareEditor
    buildsystem: simple
    build-commands:
      - cp -r . /app/bin
    sources:
      - type: dir
        path: dist/linux-x64/
finish-args:      
  - --device=dri
  - --socket=x11
  - --socket=wayland
